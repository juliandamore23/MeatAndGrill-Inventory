<script>
  // Red de seguridad: si a los 4s no se montó nada dentro de #root (por ejemplo
  // porque una de las librerías de arriba no cargó, o el código de abajo tiró
  // un error), se muestra un aviso legible en vez de dejar la pantalla en negro.
  window.addEventListener('load', function () {
    setTimeout(function () {
      var root = document.getElementById('root');
      if (root && root.children.length === 0) {
        var detail = 'sin detalle';
        if (typeof React === 'undefined') detail = 'React no cargó';
        else if (typeof ReactDOM === 'undefined') detail = 'ReactDOM no cargó';
        else if (typeof window.supabase === 'undefined') detail = 'Supabase no cargó';
        else if (typeof Babel === 'undefined') detail = 'Babel no cargó';
        document.getElementById('boot-error-detail').textContent = detail;
        document.getElementById('boot-error').style.display = 'flex';
      }
    }, 4000);
  });
</script>

function normalizar(t) {
  return String(t || '')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .toLowerCase()
    .trim();
}

function canView(role, category) {
  if (VIEW_ALL_ROLES.includes(role)) return true;
  // El resto ve la cocina entera y nada de caja. Un rol que no esté en
  // ninguna de las dos listas (por ejemplo "Sin rol") no ve nada, a propósito.
  if (VIEW_COCINA_ROLES.includes(role)) return !CAJA_CATEGORIES.includes(category);
  return false;
}
function canEdit(role, category) {
  if (EDIT_ALL_ROLES.includes(role)) return true;
  return (ROLE_EDIT_CATEGORIES[role] || []).includes(category);
}
// Con qué email entra cada persona a Supabase Auth.
// Si la fila de EMPLOYEES tiene "email", se usa ese — el mail personal de
// verdad, así puede recuperar su clave y recibir los avisos de Supabase.
// Si no lo tiene todavía, se le arma uno interno a partir del nombre
// ("Mariela Caja" -> mariela.caja@meatandgrill.local), que no recibe
// correo pero sirve igual como identificador para el login.
// El email que devuelve esta función tiene que coincidir EXACTAMENTE con
// el de la cuenta en Supabase, si no el login falla con "PIN incorrecto".
function employeeEmail(emp) {
  const person = typeof emp === 'string' ? { name: emp } : (emp || {});
  if (person.email) return person.email.trim().toLowerCase();
  const slug = String(person.name || '')
    .normalize('NFD').replace(/[̀-ͯ]/g, '') // saca acentos
    .toLowerCase().trim().replace(/\s+/g, '.');
  return `${slug}@meatandgrill.local`;
}

// Supabase exige contraseñas de 6 caracteres como mínimo y no permite
// bajar ese límite, pero los PIN del local son de 4 dígitos. Por eso le
// pegamos el sufijo "mg" antes de mandarlo: el PIN 1234 viaja como
// "1234mg". La persona nunca ve esto; solo escribe sus 4 dígitos.
// IMPORTANTE: las cuentas en Supabase se crean con la password YA con el
// sufijo incluido, si no el login falla.
function pinToPassword(pin) {
  return `${pin}mg`;
}

function totalUnits(p) {
  return p.factor ? p.stock * p.factor : null;
}

// Si "minimo" falta o no es válido, se usa 1 por defecto (en vez de que la
// comparación falle silenciosamente y el producto nunca muestre alerta).
function isLow(p) {
  const stock = Number(p.stock);
  const minimoRaw = Number(p.minimo);
  const minimo = Number.isFinite(minimoRaw) ? minimoRaw : 1;
  if (!Number.isFinite(stock)) return false;
  return stock <= minimo;
}

// Stock en orden: por ENCIMA del minimo. Ojo que isLow() usa <=, asi que
// estar justo en el minimo cuenta como alerta (es el punto de reposicion).
// Plural de la unidad. Antes se pegaba una "s" y salian cosas como
// "0 Unidads", "3 Sachet de 3kgs" o "1 Caja de 196 unidadess".
// Reglas: solo se pluraliza el sustantivo principal (lo de antes del primer
// espacio), las siglas quedan igual, y el resto sigue el castellano.
const PLURAL_IRREGULAR = { GN: 'GN' };
function plural(unidad, cantidad) {
  const texto = String(unidad || '');
  if (cantidad === 1 || !texto) return texto;
  const partes = texto.split(' ');
  const cabeza = partes[0];
  if (PLURAL_IRREGULAR[cabeza]) partes[0] = PLURAL_IRREGULAR[cabeza];
  else if (/^[A-Z0-9]{1,3}$/.test(cabeza)) partes[0] = cabeza;          // siglas: GN, L, ml
  else if (/[aeiou]$/i.test(cabeza)) partes[0] = cabeza + 's';          // Bolsa -> Bolsas
  else if (/ón$/i.test(cabeza)) partes[0] = cabeza.slice(0, -2) + 'ones'; // Bidón -> Bidones
  else if (/z$/i.test(cabeza)) partes[0] = cabeza.slice(0, -1) + 'ces';
  else if (/t$/i.test(cabeza)) partes[0] = cabeza + 's';                // Sachet -> Sachets
  else partes[0] = cabeza + 'es';                                       // Unidad -> Unidades
  return partes.join(' ');
}

function isOk(p) {
  return Number.isFinite(Number(p.stock)) && !isLow(p);
}

function movementFromRow(row) {

    productId: row.product_id,
    productName: row.product_name,

function App() {
  const [checkingSession, setCheckingSession] = useState(true);
  const [loading, setLoading] = useState(false);
  const [loadError, setLoadError] = useState(null);
  const [saving, setSaving] = useState(false);
  const [products, setProducts] = useState(SEED_PRODUCTS);
  const [movements, setMovements] = useState([]);
  const [view, setView] = useState('login');
  const [user, setUser] = useState(null); // { id, name, role } una vez logueado de verdad
  const [pendingEmployee, setPendingEmployee] = useState(null); // { name, role } elegido, esperando PIN
  const [pin, setPin] = useState('');
  const [buscar, setBuscar] = useState('');
  const [authError, setAuthError] = useState(null);
  const [authLoading, setAuthLoading] = useState(false);
  const [menu, setMenu] = useState(null);
  const [period, setPeriod] = useState(null);
  const [category, setCategory] = useState(null);
  const [productId, setProductId] = useState(null);
  const [actionMode, setActionMode] = useState(null);
  const [qty, setQty] = useState(1);
  const [note, setNote] = useState('');
  const [toast, setToast] = useState(null);

  // Al abrir la app, si ya había una sesión iniciada antes en este
  // dispositivo, entramos directo sin pedir PIN de nuevo.
  useEffect(() => {
    let cancelled = false;
    sb.auth.getSession().then(({ data }) => {
      if (cancelled) return;
      const authUser = data && data.session && data.session.user;
      if (authUser) {
        const meta = authUser.user_metadata || {};
        setUser({ id: authUser.id, name: meta.name || authUser.email, role: meta.role || 'Sin rol' });
        setView('menu');
      }
      setCheckingSession(false);
    });
    return () => { cancelled = true; };
  }, []);

  const load = useCallback(async () => {
    if (!user) return;
    setLoading(true);
    setLoadError(null);
    try {
      const [{ data: productRows, error: pErr }, { data: movementRows, error: mErr }] = await Promise.all([
        sb.from('products').select('*').order('name'),
        sb.from('movements').select('*').order('ts', { ascending: false }).limit(300),
      ]);
      if (pErr) throw pErr;
      if (mErr) throw mErr;
      setProducts(productRows && productRows.length ? productRows : []);
      setMovements((movementRows || []).map(movementFromRow));
    } catch (e) {
      console.error('Error cargando desde Supabase', e);
      setLoadError(e && e.message ? e.message : String(e));
    } finally {
      setLoading(false);
    }
  }, [user]);

  useEffect(() => { load(); }, [load]);

  // Sincronización en tiempo real: cuando otro dispositivo carga un
  // movimiento o cambia el stock de un producto, esta pantalla se actualiza
  // sola, sin necesidad de refrescar. Solo tiene sentido una vez logueado
  // (antes de eso, RLS igual no te deja ver nada).
  useEffect(() => {
    if (!user) return;
    const channel = sb
      .channel('inventario-realtime')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'products' }, (payload) => {
        setProducts(prev => {
          if (payload.eventType === 'DELETE') return prev.filter(p => p.id !== payload.old.id);
          const updated = payload.new;
          const exists = prev.some(p => p.id === updated.id);
          return exists ? prev.map(p => (p.id === updated.id ? updated : p)) : [...prev, updated];
        });
      })
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'movements' }, (payload) => {
        setMovements(prev => {
          if (prev.some(m => m.id === payload.new.id)) return prev;
          return [movementFromRow(payload.new), ...prev].slice(0, 300);
        });
      })
      .subscribe();
    return () => { sb.removeChannel(channel); };
  }, [user]);

  async function handlePinSubmit() {
    if (!pendingEmployee) return;
    setAuthLoading(true);
    setAuthError(null);
    try {
      const { data, error } = await sb.auth.signInWithPassword({
        email: employeeEmail(pendingEmployee),
        password: pinToPassword(pin),
      });
      if (error) throw error;
      const meta = (data.user && data.user.user_metadata) || {};
      setUser({
        id: data.user.id,
        name: meta.name || pendingEmployee.name,
        role: meta.role || pendingEmployee.role,
      });
      setPendingEmployee(null);
      setPin('');
      setView('menu');
    } catch (e) {
      console.error('Error de login', e);
      setAuthError('PIN incorrecto, probá de nuevo');
      setPin('');
    } finally {
      setAuthLoading(false);
    }
  }

  async function handleLogout() {
    // scope 'local' borra la sesion guardada en este dispositivo sin pedirle
    // permiso al servidor. Es lo que hace falta cuando el token esta roto:
    // un signOut normal se lo manda a Supabase, Supabase lo rechaza por
    // invalido, y la sesion rota quedaria guardada para siempre.
    try {
      await sb.auth.signOut({ scope: 'local' });
    } catch (e) {
      console.error('No se pudo cerrar sesion limpiamente', e);
    }
    setUser(null);
    setPendingEmployee(null);
    setPin('');
    setBuscar('');
    setMenu(null);
    setPeriod(null);
    setLoadError(null);
    setProducts([]);
    setMovements([]);
    setView('login');
  }

  function showToast(msg) {
    setToast(msg);
    setTimeout(() => setToast(null), 2200);
  }

  function openProduct(id) {
    setProductId(id);
    setActionMode(null);
    setView('detail');
  }

  const currentProduct = products.find(p => p.id === productId) || null;

  function startAction(mode) {
    setActionMode(mode);
    setQty(mode === 'conteo' ? (currentProduct ? currentProduct.stock : 0) : 1);
    setNote('');
  }

  function cancelAction() {
    setActionMode(null);
    setNote('');
  }

  async function confirmAction() {
    if (!currentProduct) return;
    // Si qty quedó en un valor no numérico (por ejemplo el input se vació),
    // se usa 0 en vez de dejar que se propague un NaN al stock guardado.
    const qtyNum = Number.isFinite(qty) ? Math.max(0, qty) : 0;

    let newStock = currentProduct.stock;
    if (actionMode === 'ingreso') newStock = currentProduct.stock + qtyNum;
    if (actionMode === 'salida') newStock = Math.max(0, currentProduct.stock - qtyNum);
    if (actionMode === 'conteo') newStock = qtyNum;

    setSaving(true);
    try {
      const { error: updErr } = await sb
        .from('products')
        .update({ stock: newStock, updated_at: new Date().toISOString() })
        .eq('id', productId);
      if (updErr) throw updErr;

      const { error: insErr } = await sb.from('movements').insert({
        employee: user.name,
        role: user.role,
        product_id: currentProduct.id,
        product_name: currentProduct.name,
        category: currentProduct.category,
        type: actionMode,
        qty: qtyNum,
        result_stock: newStock,
        note: note.trim() || null,
      });
      if (insErr) throw insErr;

      // Actualizamos ya esta pantalla (no hace falta esperar el eco de
      // Realtime, que igual va a confirmar lo mismo un instante después).
      setProducts(prev => prev.map(p => (p.id === productId ? { ...p, stock: newStock } : p)));

      const labels = { ingreso: 'Ingreso guardado', salida: 'Salida guardada', conteo: 'Conteo actualizado' };
      showToast(`${labels[actionMode]} · ${currentProduct.name}`);
      setActionMode(null);
      setNote('');
    } catch (e) {
      console.error('Error guardando en Supabase', e);
      showToast('No se pudo guardar — revisá tu conexión');
    } finally {
      setSaving(false);
    }
  }

  function matchesMenu(p) {
    if (menu === 'Caja') return p.menu === 'Caja' && p.period === period;
    return p.menu !== 'Caja';
  }
  const allCategoriesForMenu = menu === 'Caja' ? (CAJA_STRUCTURE[period] || []) : CATEGORIES;
  const activeCategories = user ? allCategoriesForMenu.filter(cat => canView(user.role, cat.key)) : allCategoriesForMenu;
  const canEditCurrentProduct = user && currentProduct ? canEdit(user.role, currentProduct.category) : false;
  // Busca en el nombre y tambien en el rol, asi escribir "cocinero" trae a
  // todos los cocineros. Con el campo vacio se ve la lista completa.
  const textoBuscado = normalizar(buscar);
  const empleadosFiltrados = textoBuscado
    ? EMPLEADOS_ORDENADOS.filter(e =>
        normalizar(e.name).indexOf(textoBuscado) !== -1 ||
        normalizar(e.role).indexOf(textoBuscado) !== -1)
    : EMPLEADOS_ORDENADOS;

  function elegirEmpleado(emp) {
    setPendingEmployee(emp);
    setAuthError(null);
    setPin('');
    setBuscar('');
  }

  const visibleProducts = products.filter(matchesMenu);
  const visibleLowCount = visibleProducts.filter(isLow).length;

  function goBack() {
    if (view === 'detail') setView('products');
    else if (view === 'products') setView('categories');
    else if (view === 'categories') setView(menu === 'Caja' ? 'periods' : 'menu');
    else if (view === 'periods') setView('menu');
  }

  const containerStyle = { background: C.bg, minHeight: '100vh', color: C.cream };

  if (checkingSession) {
    return (
      <div style={{ ...containerStyle, display: 'flex', alignItems: 'center', justifyContent: 'center' }} className="mg-body">
        <div style={{ color: C.muted }}>Cargando…</div>
      </div>
    );
  }

  if (loading) {
    return (
      <div style={{ ...containerStyle, display: 'flex', alignItems: 'center', justifyContent: 'center' }} className="mg-body">
        <div style={{ color: C.muted }}>Cargando inventario…</div>
      </div>
    );
  }

  if (loadError) {
    // Si el problema es la sesion guardada (token vencido, con fecha rara por
    // un reloj desfasado, o invalidado desde Supabase), reintentar no sirve:
    // vuelve a mandar el mismo token roto. Lo unico que destraba es cerrar
    // sesion y volver a entrar, asi que en ese caso ese es el boton principal.
    const esSesion = /jwt|token|session|expired|issued|invalid|401|403/i.test(String(loadError));
    return (
      <div style={{ ...containerStyle, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24, textAlign: 'center' }} className="mg-body">
        <div style={{ maxWidth: 320 }}>
          <div style={{ fontWeight: 600, marginBottom: 8 }}>
            {esSesion ? 'Tu sesión venció' : 'No se pudo conectar con la base de datos'}
          </div>
          <div style={{ color: C.muted, fontSize: 13, margin: '0 auto 16px' }}>
            {esSesion
              ? 'Volvé a entrar con tu PIN y listo. No se pierde nada de lo cargado.'
              : 'Revisá tu conexión a internet e intentá de nuevo.'}
          </div>
          <div style={{ color: C.muted, fontSize: 11, margin: '0 auto 16px', opacity: 0.7 }}>{loadError}</div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
            <button onClick={esSesion ? handleLogout : load} className="mg-tap" style={{ padding: '11px 20px', borderRadius: 10, background: C.accent, border: 'none', color: '#fff', cursor: 'pointer', fontWeight: 600, fontSize: 14 }}>
              {esSesion ? 'Volver a entrar' : 'Reintentar'}
            </button>
            <button onClick={esSesion ? load : handleLogout} className="mg-tap" style={{ padding: '10px 20px', borderRadius: 10, background: 'transparent', border: `1px solid ${C.line}`, color: C.muted, cursor: 'pointer', fontSize: 13 }}>
              {esSesion ? 'Reintentar' : 'Cerrar sesión'}
            </button>
          </div>
        </div>
      </div>
    );
  }

  // Cada pantalla tiene su foto. Van en una capa FIJA y no como background
  // del contenedor: las pantallas scrollean y el fondo se iria con ellas.
  //
  // El velo encima cambia de intensidad segun cuanto haya que leer arriba.
  // Login y menu tienen pocos elementos y grandes, asi que se banca ver la
  // foto. Las pantallas de adentro son listas densas de productos con estados
  // en ambar y verde: ahi el velo va casi opaco y la foto queda como textura.
  // Si una imagen no cargara, queda el negro de siempre.
  const FONDOS = {
    login:      { foto: 'fondo.jpg',             velo: [0.30, 0.52, 0.86, 0.97] },
    menu:       { foto: 'fondo-menu.jpg',        velo: [0.55, 0.66, 0.82, 0.94] },
    cocina:     { foto: 'fondo-cocina.jpg',      velo: [0.62, 0.72, 0.86, 0.95] },
    // La de Caja no es una foto de fondo sino un recorte sobre blanco. Va
    // como emblema centrado sobre el negro, no estirada a pantalla completa:
    // asi no queda un fondo casi blanco con la bolsa cortada por los bordes.
    caja:       { emblema: 'fondo-caja.png' },
    // Dentro de una categoria NO va foto. Ahi se cambia el stock y hay que
    // leer los estados en ambar y verde de un vistazo: cualquier imagen
    // detras compite justo donde no tiene que competir.
    // En su lugar va el negro de la marca con el damero rojo y blanco muy
    // tenue, que es el patron de Meat & Grill, y una luz roja arriba.
    productos:  { color: true },
  };
  const fondoActual = FONDOS[
    view === 'login' ? 'login'
    : view === 'menu' ? 'menu'
    : (view === 'products' || view === 'detail') ? 'productos'
    : menu === 'Caja' ? 'caja'
    : 'cocina'
  ];
  const capaFondo = fondoActual.emblema
    ? {
        position: 'fixed', inset: 0, zIndex: 0, pointerEvents: 'none',
        backgroundColor: C.bg,
        backgroundImage:
          'radial-gradient(120% 70% at 50% 42%,'
          + ' rgba(245,28,21,0.13) 0%, rgba(14,14,14,0) 70%),'
          + ' url("' + fondoActual.emblema + '")',
        backgroundSize: '100% 100%, min(62vw, 300px) auto',
        backgroundPosition: 'center, center 46%',
        backgroundRepeat: 'no-repeat, no-repeat',
        opacity: 1,
      }
    : fondoActual.color
    ? {
        position: 'fixed', inset: 0, zIndex: 0, pointerEvents: 'none',
        backgroundColor: C.bg,
        backgroundImage:
          'repeating-conic-gradient('
          + 'rgba(245,28,21,0.14) 0% 25%, rgba(255,255,255,0.075) 0% 50%),'
          + ' radial-gradient(120% 62% at 50% -12%,'
          + ' rgba(245,28,21,0.26) 0%, rgba(245,28,21,0.08) 45%, rgba(14,14,14,0) 75%)',
        backgroundSize: '64px 64px, 100% 100%',
        backgroundPosition: 'center, center',
        backgroundRepeat: 'repeat, no-repeat',
      }
    : {
        position: 'fixed', inset: 0, zIndex: 0, pointerEvents: 'none',
        backgroundColor: C.bg,
        backgroundImage:
          'linear-gradient(to bottom,'
          + ' rgba(14,14,14,' + fondoActual.velo[0] + ') 0%,'
          + ' rgba(14,14,14,' + fondoActual.velo[1] + ') 30%,'
          + ' rgba(14,14,14,' + fondoActual.velo[2] + ') 62%,'
          + ' rgba(14,14,14,' + fondoActual.velo[3] + ') 100%),'
          + ' url("' + fondoActual.foto + '")',
        backgroundSize: 'cover, cover',
        backgroundPosition: 'center, center',
        backgroundRepeat: 'no-repeat, no-repeat',
      };

  return (
    <div style={containerStyle} className="mg-body">
      <div style={capaFondo} aria-hidden="true" />
      <div style={{ maxWidth: 440, margin: '0 auto', minHeight: '100vh', display: 'flex', flexDirection: 'column', position: 'relative', zIndex: 1 }}>

        {view === 'login' && !pendingEmployee && (
          <div style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'flex-start', padding: '40px 24px 24px', gap: 22 }}>
            <StampBadge />
            <div style={{ textAlign: 'center' }}>
              {/* Sin el "MEAT & GRILL" grande: la foto de fondo ya lo trae, y
                  con el sello arriba quedaban tres veces el mismo nombre. */}
              <div style={{ color: C.cream, fontSize: 13, letterSpacing: '0.18em', opacity: 0.85 }}>CONTROL DE STOCK</div>
            </div>
            <div style={{ width: '100%' }}>
              <div className="mg-display" style={{ color: C.cream, fontSize: 19, fontWeight: 700, letterSpacing: '0.02em', marginBottom: 12, textAlign: 'center' }}>¿Quién sos?</div>
              {/* Sin fondo propio ni relleno: asi el campo se ve igual que
                  antes, flotando sobre la foto, en vez de parecer una banda
                  pegada aparte. Al scrollear queda fijo arriba y tapa lo que
                  pasa por detras con su propia opacidad. */}
              <div style={{ position: 'sticky', top: 0, zIndex: 5, marginBottom: 12 }}>
               <div style={{ position: 'relative' }}>
                <input
                  type="text"
                  value={buscar}
                  onChange={e => setBuscar(e.target.value)}
                  onKeyDown={e => {
                    // Si la busqueda dejo una sola persona, Enter la elige.
                    if (e.key === 'Enter' && empleadosFiltrados.length === 1) {
                      elegirEmpleado(empleadosFiltrados[0]);
                    }
                  }}
                  placeholder="Buscar por nombre o rol"
                  aria-label="Buscar por nombre o rol"
                  autoFocus
                  autoComplete="off"
                  autoCorrect="off"
                  autoCapitalize="none"
                  spellCheck={false}
                  className="mg-body"
                  style={{
                    width: '100%', boxSizing: 'border-box',
                    background: 'rgba(24,24,24,0.95)', border: `1px solid ${C.line}`,
                    borderRadius: 12, padding: '13px 40px 13px 14px',
                    color: C.cream, fontSize: 15, outline: 'none',
                    backdropFilter: 'blur(12px)', WebkitBackdropFilter: 'blur(12px)',
                    boxShadow: '0 6px 16px rgba(0,0,0,0.30)',
                  }}
                />
                {buscar && (
                  <button
                    onClick={() => setBuscar('')}
                    aria-label="Borrar la busqueda"
                    className="mg-tap"
                    style={{
                      position: 'absolute', right: 6, top: '50%', transform: 'translateY(-50%)',
                      width: 30, height: 30, borderRadius: 999, border: 'none',
                      background: 'transparent', color: C.muted, fontSize: 20,
                      cursor: 'pointer', lineHeight: 1,
                    }}
                  >&times;</button>
                )}
               </div>
              </div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                {/* La lista arranca oculta: aparece recien al escribir. Asi la
                    pantalla queda limpia y se ve la foto, en vez de 14 botones
                    que ademas obligaban a scrollear. */}
                {!textoBuscado && (
                  <div style={{ color: C.muted, fontSize: 13, textAlign: 'center', padding: '10px 0 4px' }}>
                    Escribí tu nombre o tu rol
                  </div>
                )}
                {textoBuscado && empleadosFiltrados.length === 0 && (
                  <div style={{ color: C.muted, fontSize: 13, textAlign: 'center', padding: '18px 0' }}>
                    Nadie coincide con "{buscar}".
                  </div>
                )}
                {textoBuscado && empleadosFiltrados.map(emp => (
                  <button key={emp.name} onClick={() => elegirEmpleado(emp)} className="mg-tap" style={{
                    display: 'flex', alignItems: 'center', justifyContent: 'space-between',
                    background: 'rgba(26,26,26,0.86)', border: `1px solid ${C.line}`, borderRadius: 12,
                    padding: '14px 16px', color: C.cream, cursor: 'pointer',
                    backdropFilter: 'blur(3px)', WebkitBackdropFilter: 'blur(3px)',
                  }}>
                    <span style={{ fontWeight: 600, fontSize: 16 }}>{emp.name}</span>
                    <span style={{ color: C.muted, fontSize: 13 }}>{emp.role}</span>
                  </button>
                ))}
              </div>
            </div>
          </div>
        )}

        {view === 'login' && pendingEmployee && (
          <div style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: 24, gap: 24 }}>
            <StampBadge />
            <div style={{ textAlign: 'center' }}>
              <div className="mg-display" style={{ fontSize: 22, fontWeight: 700 }}>{pendingEmployee.name}</div>
              <div style={{ color: C.muted, fontSize: 13, marginTop: 4 }}>{pendingEmployee.role}</div>
            </div>
            <div style={{ width: '100%', maxWidth: 240 }}>
              <input
                type="password"
                inputMode="numeric"
                pattern="[0-9]*"
                maxLength={6}
                autoFocus
                placeholder="PIN"
                value={pin}
                onChange={e => setPin(e.target.value.replace(/[^0-9]/g, ''))}
                onKeyDown={e => { if (e.key === 'Enter' && pin && !authLoading) handlePinSubmit(); }}
                className="mg-display"
                style={{
                  width: '100%', textAlign: 'center', fontSize: 28, letterSpacing: '0.3em',
                  background: C.surface, border: `1px solid ${authError ? C.alert : C.line}`, borderRadius: 12,
                  padding: '14px 12px', color: C.cream, outline: 'none',
                }}
              />
              {authError && (
                <div style={{ color: C.alert, fontSize: 13, textAlign: 'center', marginTop: 10 }}>{authError}</div>
              )}
              <button
                onClick={handlePinSubmit}
                disabled={!pin || authLoading}
                className="mg-tap"
                style={{
                  width: '100%', marginTop: 16, padding: '13px 0', borderRadius: 10,
                  background: C.accent, border: 'none', color: '#fff', cursor: pin ? 'pointer' : 'not-allowed',
                  fontWeight: 600, fontSize: 14, opacity: !pin || authLoading ? 0.6 : 1,
                }}
              >
                {authLoading ? 'Entrando…' : 'Entrar'}
              </button>
              <button
                onClick={() => { setPendingEmployee(null); setPin(''); setAuthError(null); }}
                className="mg-tap"
                style={{ width: '100%', marginTop: 10, padding: '8px 0', background: 'none', border: 'none', color: C.muted, cursor: 'pointer', fontSize: 13 }}
              >
                Volver
              </button>
            </div>
          </div>
        )}

        {view !== 'login' && (
          <>
            <div style={{
              // Sin fondo ni linea de abajo: la barra se apoya directo sobre
              // la foto en vez de cortarla con un bloque. La sombra del texto
              // es lo unico que la mantiene legible sobre las partes claras.
              position: 'sticky', top: 0, zIndex: 10,
              background: 'transparent', padding: '14px 16px',
              textShadow: '0 1px 6px rgba(0,0,0,0.85)',
              display: 'flex', alignItems: 'center', justifyContent: 'space-between',
            }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                {view !== 'menu' && (
                  <button onClick={goBack} className="mg-tap" style={{ background: 'none', border: 'none', color: C.cream, display: 'flex', alignItems: 'center', cursor: 'pointer', padding: 4 }}>
                    <ChevronLeft size={22} />
                  </button>
                )}
                <div className="mg-display" style={{ fontSize: 18, fontWeight: 700 }}>
                  {view === 'menu' ? 'MEAT & GRILL'
                    : view === 'periods' ? 'CAJA'
                    : view === 'categories' ? (menu === 'Caja' ? `CAJA · ${period}` : 'COCINA')
                    : view === 'products' ? category
                    : (currentProduct ? currentProduct.name : '')}
                </div>
              </div>
              {/* Antes el nombre mismo era el boton de salir, y no habia
                  forma de saberlo. Ahora el nombre solo informa y al lado va
                  un boton explicito, con su borde y su icono. */}
              <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                <span style={{ display: 'flex', alignItems: 'center', gap: 6, color: C.muted, fontSize: 12 }}>
                  <UserCircle2 size={16} />
                  {user ? user.name : ''}
                </span>
                <button
                  onClick={handleLogout}
                  aria-label="Cerrar sesión"
                  title="Cerrar sesión"
                  className="mg-tap"
                  style={{
                    display: 'flex', alignItems: 'center', gap: 5,
                    background: 'rgba(26,26,26,0.7)', border: `1px solid ${C.line}`,
                    borderRadius: 999, padding: '6px 11px 6px 9px',
                    color: C.cream, cursor: 'pointer', fontSize: 12, fontWeight: 600,
                  }}
                >
                  <LogOut size={14} />
                  Salir
                </button>
              </div>
            </div>

            {view === 'menu' && (
              <div style={{ padding: 16, flex: 1, display: 'flex', flexDirection: 'column', gap: 14, justifyContent: 'center' }}>
                <button onClick={() => { setMenu('Cocina'); setCategory(null); setView('categories'); }} className="mg-tap" style={menuCardStyle}>
                  <div style={{ fontSize: 32 }}>🍳</div>
                  <div className="mg-display" style={{ fontSize: 20, fontWeight: 700, marginTop: 8 }}>COCINA</div>
                  <div style={{ fontSize: 12, color: C.muted, marginTop: 4 }}>Inventario de cocina y depósito</div>
                </button>
                {user && VIEW_ALL_ROLES.includes(user.role) && (
                  <button onClick={() => { setMenu('Caja'); setPeriod(null); setView('periods'); }} className="mg-tap" style={menuCardStyle}>
                    <div style={{ fontSize: 32 }}>💰</div>
                    <div className="mg-display" style={{ fontSize: 20, fontWeight: 700, marginTop: 8 }}>CAJA</div>
                    <div style={{ fontSize: 12, color: C.muted, marginTop: 4 }}>Conteo semanal y mensual</div>
                  </button>
                )}
              </div>
            )}

            {view === 'periods' && (
              <div style={{ padding: 16, flex: 1, display: 'flex', flexDirection: 'column', gap: 14 }}>
                {Object.keys(CAJA_STRUCTURE).map(per => (
                  <button key={per} onClick={() => { setPeriod(per); setCategory(null); setView('categories'); }} className="mg-tap" style={menuCardStyle}>
                    <div style={{ fontSize: 28 }}>{per === 'Semanal' ? '📅' : '🗓️'}</div>
                    <div className="mg-display" style={{ fontSize: 18, fontWeight: 700, marginTop: 8 }}>Conteo {per}</div>
                    <div style={{ fontSize: 12, color: C.muted, marginTop: 4 }}>{CAJA_STRUCTURE[per].length} categorías</div>
                  </button>
                ))}
              </div>
            )}

            {view === 'categories' && (
              <div style={{ padding: 16, flex: 1 }}>
                {visibleLowCount > 0 && (
                  <div style={{
                    display: 'flex', alignItems: 'center', gap: 8, background: C.alertSoft,
                    border: `1px solid ${C.alert}`, borderRadius: 10, padding: '10px 12px', marginBottom: 16, fontSize: 13,
                  }}>
                    <AlertTriangle size={16} color={C.alert} />
                    <span>{visibleLowCount} producto{visibleLowCount > 1 ? 's' : ''} para reponer</span>
                  </div>
                )}
                {visibleLowCount === 0 && visibleProducts.length > 0 && (
                  <div style={{
                    display: 'flex', alignItems: 'center', gap: 8, background: C.okSoft,
                    border: `1px solid ${C.ok}`, borderRadius: 10, padding: '10px 12px', marginBottom: 16, fontSize: 13,
                  }}>
                    <Check size={16} color={C.ok} />
                    <span>Todo por encima del mínimo</span>
                  </div>
                )}
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
                  {activeCategories.map(cat => {
                    const items = products.filter(p => p.category === cat.key && matchesMenu(p));
                    const low = items.filter(isLow).length;
                    return (
                      <button key={cat.key} onClick={() => { setCategory(cat.key); setView('products'); }} className="mg-tap" style={{
                        position: 'relative', background: C.surface, border: `1px solid ${C.line}`,
                        borderRadius: 14, padding: '18px 12px', textAlign: 'left', cursor: 'pointer', color: C.cream,
                      }}>
                        {items.length > 0 && (
                          <div style={{
                            position: 'absolute', top: 10, right: 10, width: 9, height: 9,
                            borderRadius: '9999px', background: low > 0 ? C.alert : C.ok,
                          }} />
                        )}
                        <div style={{ fontSize: 26, marginBottom: 8 }}>{cat.emoji}</div>
                        <div className="mg-display" style={{ fontSize: 15, fontWeight: 600 }}>{cat.key}</div>
                        <div style={{ fontSize: 12, color: C.muted, marginTop: 2 }}>{items.length} productos</div>
                      </button>
                    );
                  })}
                </div>
              </div>
            )}

            {view === 'products' && (
              <div style={{ padding: 16, flex: 1 }}>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                  {products.filter(p => p.category === category && matchesMenu(p)).map(p => {
                    const low = isLow(p);
                    const ok = isOk(p);
                    const units = totalUnits(p);
                    return (
                      <button key={p.id} onClick={() => openProduct(p.id)} className="mg-tap" style={{
                        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
                        background: C.surface, border: `1px solid ${low ? C.alert : ok ? C.ok : C.line}`,
                        borderRadius: 12, padding: '14px 16px', cursor: 'pointer', color: C.cream, textAlign: 'left',
                      }}>
                        <div style={{ display: 'flex', alignItems: 'center', gap: 12, minWidth: 0 }}>
                          <div style={{ fontSize: 24, lineHeight: 1, flexShrink: 0 }}>{productIcon(p)}</div>
                          <div style={{ minWidth: 0 }}>
                            <div style={{ fontWeight: 600, fontSize: 15 }}>{p.name}</div>
                            <div style={{ fontSize: 12, color: C.muted, marginTop: 2 }}>
                              {p.stock} {plural(p.unit, p.stock)}{units ? ` · ${units} u.` : ''}
                              <span style={{ color: low ? C.alert : ok ? C.ok : C.muted }}>
                                {' · mín. '}{p.minimo}
                              </span>
                            </div>
                          </div>
                        </div>
                        {low && <AlertTriangle size={18} color={C.alert} />}
                        {ok && <Check size={18} color={C.ok} />}
                      </button>
                    );
                  })}
                </div>
              </div>
            )}

            {view === 'detail' && currentProduct && (
              <div style={{ padding: 16, flex: 1, display: 'flex', flexDirection: 'column', gap: 16 }}>
                <div style={{ background: C.surface, border: `1px solid ${C.line}`, borderRadius: 16, padding: '24px 20px 20px', textAlign: 'center' }}>
                  <div style={{ fontSize: 54, lineHeight: 1 }}>{productIcon(currentProduct)}</div>
                  <div className="mg-display" style={{ fontSize: 26, fontWeight: 700, lineHeight: 1.15, marginTop: 10 }}>
                    {currentProduct.name}
                  </div>
                  <div style={{ fontSize: 12, color: C.muted, marginTop: 6, marginBottom: 16 }}>{currentProduct.category} · {currentProduct.unit}</div>
                  <div className="mg-display" style={{ fontSize: 44, fontWeight: 700, lineHeight: 1 }}>{currentProduct.stock}</div>
                  <div style={{ fontSize: 13, color: C.muted, marginTop: 4 }}>
                    {plural(currentProduct.unit, currentProduct.stock)}
                    {totalUnits(currentProduct) ? ` · ${totalUnits(currentProduct)} unidades` : ''}
                  </div>
                  {isLow(currentProduct) && (
                    <div style={{
                      marginTop: 12, display: 'inline-flex', alignItems: 'center', gap: 6,
                      background: C.alertSoft, border: `1px solid ${C.alert}`, borderRadius: 999,
                      padding: '6px 12px', fontSize: 12, color: C.alert,
                    }}>
                      <AlertTriangle size={14} />
                      Hay que reponer — mínimo {currentProduct.minimo}
                    </div>
                  )}
                  {isOk(currentProduct) && (
                    <div style={{
                      marginTop: 12, display: 'inline-flex', alignItems: 'center', gap: 6,
                      background: C.okSoft, border: `1px solid ${C.ok}`, borderRadius: 999,
                      padding: '6px 12px', fontSize: 12, color: C.ok,
                    }}>
                      <Check size={14} />
                      En stock — mínimo {currentProduct.minimo}
                    </div>
                  )}
                </div>

                {!actionMode && canEditCurrentProduct && (
                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 10 }}>
                    <button onClick={() => startAction('ingreso')} className="mg-tap" style={btnStyle(C.ok)}>
                      <Plus size={18} /><span style={{ fontSize: 12, marginTop: 4 }}>INGRESO</span>
                    </button>
                    <button onClick={() => startAction('salida')} className="mg-tap" style={btnStyle(C.alert)}>
                      <Minus size={18} /><span style={{ fontSize: 12, marginTop: 4 }}>SALIDA</span>
                    </button>
                    <button onClick={() => startAction('conteo')} className="mg-tap" style={btnStyle(C.accent)}>
                      <RotateCcw size={18} /><span style={{ fontSize: 12, marginTop: 4 }}>CONTEO</span>
                    </button>
                  </div>
                )}

                {!actionMode && !canEditCurrentProduct && (
                  <div style={{
                    textAlign: 'center', padding: '12px 0', color: C.muted, fontSize: 13,
                    background: C.surface, border: `1px solid ${C.line}`, borderRadius: 12,
                  }}>
                    Solo lectura — tu rol no puede editar esta categoría
                  </div>
                )}

                {actionMode && (
                  <div style={{ background: C.surface2, border: `1px solid ${C.line}`, borderRadius: 16, padding: 18 }}>
                    <div className="mg-display" style={{ fontSize: 15, fontWeight: 600, marginBottom: 4 }}>
                      {actionMode === 'ingreso' ? 'Registrar ingreso' : actionMode === 'salida' ? 'Registrar salida' : 'Hacer conteo'}
                    </div>
                    <div style={{ fontSize: 12, color: C.muted, marginBottom: 16 }}>
                      {actionMode === 'conteo' ? 'Ingresá el stock real que contaste' : `Cantidad de ${plural(currentProduct.unit, 2).toLowerCase()}`}
                    </div>

                    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 18, marginBottom: 16 }}>
                      <button onClick={() => setQty(q => Math.max(0, q - 1))} className="mg-tap" style={{ width: 44, height: 44, borderRadius: 999, background: C.surface, border: `1px solid ${C.line}`, color: C.cream, fontSize: 20, cursor: 'pointer' }}>−</button>
                      <input
                        type="number"
                        inputMode="numeric"
                        value={qty}
                        onChange={e => {
                          const parsed = parseInt(e.target.value, 10);
                          setQty(Number.isFinite(parsed) ? Math.max(0, parsed) : 0);
                        }}
                        className="mg-display"
                        style={{ width: 90, textAlign: 'center', fontSize: 32, fontWeight: 700, background: 'transparent', border: 'none', color: C.cream, outline: 'none' }}
                      />
                      <button onClick={() => setQty(q => q + 1)} className="mg-tap" style={{ width: 44, height: 44, borderRadius: 999, background: C.surface, border: `1px solid ${C.line}`, color: C.cream, fontSize: 20, cursor: 'pointer' }}>+</button>
                    </div>

                    {actionMode === 'salida' && (
                      <input
                        type="text"
                        placeholder="Nota (opcional)"
                        value={note}
                        onChange={e => setNote(e.target.value)}
                        style={{ width: '100%', background: C.surface, border: `1px solid ${C.line}`, borderRadius: 10, padding: '10px 12px', color: C.cream, fontSize: 14, marginBottom: 16, outline: 'none' }}
                      />
                    )}

                    <div style={{ display: 'flex', gap: 10 }}>
                      <button onClick={cancelAction} className="mg-tap" style={{ flex: 1, padding: '12px 0', borderRadius: 10, background: 'transparent', border: `1px solid ${C.line}`, color: C.muted, cursor: 'pointer', fontSize: 14 }}>Cancelar</button>
                      <button onClick={confirmAction} disabled={saving} className="mg-tap" style={{ flex: 2, padding: '12px 0', borderRadius: 10, background: C.accent, border: 'none', color: '#fff', cursor: 'pointer', fontWeight: 600, fontSize: 14, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6 }}>
                        <Check size={16} /> {saving ? 'Guardando…' : 'Guardar'}
                      </button>
                    </div>
                  </div>
                )}

                <div>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 6, color: C.muted, fontSize: 12, marginBottom: 8 }}>
                    <Clock size={13} /> Últimos movimientos
                  </div>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
                    {movements.filter(m => m.productId === currentProduct.id).slice(0, 4).map(m => (
                      <div key={m.id} style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12.5, color: C.muted, borderBottom: `1px solid ${C.line}`, paddingBottom: 6 }}>
                        <span style={{ color: C.cream }}>
                          {m.employee} · {m.type === 'ingreso' ? `+${m.qty}` : m.type === 'salida' ? `−${m.qty}` : `= ${m.qty}`}
                        </span>
                        <span>{new Date(m.ts).toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit' })} {new Date(m.ts).toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' })}</span>
                      </div>
                    ))}
                    {movements.filter(m => m.productId === currentProduct.id).length === 0 && (
                      <div style={{ fontSize: 12.5, color: C.muted }}>Sin movimientos registrados todavía.</div>
                    )}
                  </div>
                </div>
              </div>
            )}
          </>
        )}

        {toast && (
          <div style={{
            position: 'fixed', bottom: 20, left: '50%', transform: 'translateX(-50%)',
            background: C.surface2, border: `1px solid ${C.line}`, borderRadius: 999,
            padding: '10px 18px', fontSize: 13, color: C.cream, boxShadow: '0 8px 24px rgba(0,0,0,0.4)',
            display: 'flex', alignItems: 'center', gap: 8, zIndex: 50,
          }}>
            <Check size={14} color={C.ok} /> {toast}
          </div>
        )}
      </div>
    </div>
  );
}

function btnStyle(color) {
  return {
    display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
    padding: '16px 0', borderRadius: 12, background: 'transparent', border: `1.5px solid ${color}`,
    color, cursor: 'pointer', fontWeight: 700,
  };
}
const menuCardStyle = {
  display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
  background: 'rgba(26,26,26,0.86)', border: '1px solid #333333', borderRadius: 16,
  padding: '28px 16px', cursor: 'pointer', color: '#FFFFFF', textAlign: 'center',
};

try {
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
} catch (e) {
  console.error('Error al iniciar la app', e);
  document.getElementById('root').innerHTML = '';
  document.getElementById('boot-error-detail').textContent = e && e.message ? e.message : String(e);
  document.getElementById('boot-error').style.display = 'flex';
}
</script>
</body>
</html>
